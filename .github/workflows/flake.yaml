name: "Flake.lock: update Nix dependencies"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  nix-update:
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bump_nix
        uses: crosleyzack/nix-bump-action@v0.1.0
        with:
          paths: |
            nix/framework/flake.nix
            nix/lenovo/flake.nix
            nix/google/flake.nix
      - if: ${{ steps.bump_nix.outputs.bumped }}
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: |
            bump nix upstream version to ${{ steps.bump_nix.outputs.target }}

